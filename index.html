<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Klasse: Plus und Sterne</title>
  <style>
    :root {
      --bg: #fff8f0;
      --card: #ffffff;
      --ink: #3d2c1e;
      --muted: #7a6455;
      --accent: #e8a87c;
      --accent-deep: #d4784a;
      --plus: #5aad6e;
      --plus-bg: #e8f6eb;
      --plus-cancelled: #c9b8a8;
      --minus: #d96b6b;
      --minus-bg: #fdeeee;
      --star: #f5e6b8;
      --star-color: #e6a817;
      --star-off: #d4c8b8;
      --mic: #6b8fd4;
      --mic-active: #e05a5a;
      --shadow: 0 2px 8px rgba(61, 44, 30, 0.07);
      --radius: 10px;
      --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --touch: 40px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
    }

    body {
      background-image:
        radial-gradient(ellipse at 10% 0%, #ffe8d6 0%, transparent 50%),
        radial-gradient(ellipse at 90% 100%, #e8f0ff 0%, transparent 45%);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding:
        calc(6px + var(--safe-top))
        calc(8px + var(--safe-right))
        calc(56px + var(--safe-bottom))
        calc(8px + var(--safe-left));
      min-height: 0;
    }

    header {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 10px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-date {
      margin: 0;
      font-size: clamp(0.75rem, 1.5vw, 0.9rem);
      font-weight: 600;
      color: var(--accent-deep);
      white-space: nowrap;
    }

    .subtitle {
      display: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    button, .btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s;
      min-height: var(--touch);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent-deep);
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1.5px solid #e8d5c4;
    }
    .btn-danger {
      background: var(--minus-bg);
      color: #a33a3a;
      border: 1.5px solid #f0c4c4;
    }

    /* Compact floating mic bar */
    .voice-bar {
      position: fixed;
      bottom: calc(8px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid #f0e0d0;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(61, 44, 30, 0.15);
      padding: 4px 14px 4px 4px;
      max-width: calc(100vw - 16px);
    }

    .mic-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #7ba3e8, var(--mic));
      color: #fff;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(107, 143, 212, 0.45);
      border: 2px solid #fff;
      padding: 0;
      min-height: 44px;
      min-width: 44px;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .mic-btn.listening {
      background: linear-gradient(145deg, #f08080, var(--mic-active));
      box-shadow: 0 0 0 4px rgba(224, 90, 90, 0.25), 0 2px 10px rgba(224, 90, 90, 0.45);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .voice-meta {
      min-width: 0;
      flex: 1;
      font-size: 0.72rem;
      line-height: 1.25;
      color: var(--muted);
    }
    .voice-meta strong {
      display: block;
      color: var(--ink);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
    }
    .last-cmd {
      color: var(--accent-deep);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 42vw;
    }
    .voice-warn {
      display: none;
      position: fixed;
      bottom: calc(60px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 499;
      background: #fff3cd;
      color: #6b5300;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      max-width: 90vw;
      line-height: 1.3;
    }
    .voice-warn.show { display: block; }

    /* Dense student grid — fit 19 on one screen */
    .students {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex: 1;
      align-content: start;
      min-height: 0;
    }

    @media (min-width: 900px) and (orientation: landscape) {
      .students { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    }
    @media (min-width: 1100px) and (orientation: landscape) {
      .students { grid-template-columns: repeat(5, 1fr); }
    }
    @media (max-width: 700px), (orientation: portrait) and (max-width: 900px) {
      .students { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    }
    @media (max-width: 480px) {
      .students { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 6px 7px 5px;
      border: 1px solid #f0e0d0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      transition: box-shadow 0.2s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
    }
    .card.flash-plus { animation: flashGreen 0.45s ease; }
    .card.flash-minus { animation: flashRed 0.45s ease; }
    .card.flash-star { animation: flashGold 0.55s ease; }

    @keyframes flashGreen {
      0% { box-shadow: 0 0 0 0 rgba(90, 173, 110, 0.55); }
      100% { box-shadow: var(--shadow); }
    }
    @keyframes flashRed {
      0% { box-shadow: 0 0 0 0 rgba(217, 107, 107, 0.5); }
      100% { box-shadow: var(--shadow); }
    }
    @keyframes flashGold {
      0% { box-shadow: 0 0 0 3px rgba(230, 168, 23, 0.5); background: #fffbeb; }
      100% { box-shadow: var(--shadow); background: var(--card); }
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
    }

    .student-name {
      font-size: clamp(0.78rem, 1.4vw, 0.95rem);
      font-weight: 700;
      margin: 0;
      line-height: 1.15;
      word-break: break-word;
      min-width: 0;
    }

    .card-menu {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      min-height: 26px;
      min-width: 26px;
      padding: 0;
      border-radius: 6px;
      background: #f5ebe3;
      color: var(--muted);
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-height: 0;
    }

    .pluses-block, .minuses-block, .stars-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.58rem;
      color: var(--muted);
      width: 28px;
      flex-shrink: 0;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      padding-top: 4px;
    }

    .plus-grid, .minus-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      min-width: 0;
    }

    .plus-row, .minus-row {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: nowrap;
      justify-content: space-between;
    }

    .slot {
      flex: 1 1 0;
      max-width: 32px;
      aspect-ratio: 1;
      min-width: 0;
      min-height: 22px;
      height: auto;
      width: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .plus-dot {
      border-radius: 50%;
      background: var(--plus);
      color: #fff;
      font-size: clamp(0.7rem, 1.6vw, 0.95rem);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 3px rgba(90, 173, 110, 0.4);
    }

    .plus-dot.cancelled {
      background: var(--plus-cancelled);
      box-shadow: none;
      position: relative;
      opacity: 0.55;
    }
    .plus-dot.cancelled::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 50%;
      height: 2px;
      background: #a33a3a;
      transform: rotate(-28deg);
      border-radius: 1px;
    }

    .plus-empty {
      border-radius: 50%;
      border: 2px dashed #b8d4b8;
      background: rgba(232, 246, 235, 0.45);
      display: inline-flex;
    }
    .plus-empty:active, .minus-empty:active {
      transform: scale(0.94);
    }

    .minus-icon {
      border-radius: 5px;
      background: var(--minus);
      color: #fff;
      font-size: clamp(0.75rem, 1.7vw, 1rem);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 1px 3px rgba(217, 107, 107, 0.35);
    }

    .minus-empty {
      border-radius: 5px;
      border: 2px dashed #e0b4b4;
      background: rgba(253, 238, 238, 0.45);
      display: inline-flex;
    }

    .stars-row { align-items: center; min-height: 18px; }

    .star-slots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .star-slot {
      font-size: 1.05rem;
      line-height: 1;
      color: var(--star-off);
      opacity: 0.45;
      transition: color 0.2s, opacity 0.2s, transform 0.2s;
    }
    .star-slot.on {
      color: var(--star-color);
      opacity: 1;
      text-shadow: 0 1px 2px rgba(180, 120, 0, 0.25);
      transform: scale(1.05);
    }

    .eff-hint {
      font-size: 0.58rem;
      color: var(--muted);
      font-weight: 600;
      margin-left: 2px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 1px;
    }

    .btn-plus, .btn-minus {
      font-size: 1.05rem;
      min-height: 32px;
      padding: 2px 4px;
      border-radius: 7px;
    }
    .btn-plus {
      background: var(--plus-bg);
      color: #2d7a40;
      border: 1.5px solid #b8e0c0;
    }
    .btn-minus {
      background: var(--minus-bg);
      color: #a33a3a;
      border: 1.5px solid #f0c4c4;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      background: var(--card);
      border-radius: var(--radius);
      border: 2px dashed #e0d0c0;
      font-size: 0.95rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(40, 28, 18, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
      transform: translateY(10px);
      transition: transform 0.2s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h3 { margin: 0 0 8px; font-size: 1.15rem; }
    .modal p { margin: 0 0 12px; color: var(--muted); line-height: 1.4; font-size: 0.9rem; }
    .modal input {
      width: 100%;
      font-size: 1.05rem;
      padding: 12px;
      border: 2px solid #e8d5c4;
      border-radius: 10px;
      font-family: inherit;
      margin-bottom: 14px;
      outline: none;
      min-height: var(--touch);
    }
    .modal input:focus { border-color: var(--accent-deep); }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .toasts {
      position: fixed;
      bottom: calc(64px + var(--safe-bottom));
      right: calc(12px + var(--safe-right));
      left: auto;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      max-width: min(320px, 70vw);
      pointer-events: none;
    }
    .toast {
      background: #3d2c1e;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      animation: toastIn 0.25s ease;
      pointer-events: auto;
      line-height: 1.3;
    }
    .toast.success { background: #2d7a40; }
    .toast.warn { background: #a33a3a; }
    .toast.star { background: #b8860b; }
    .toast.info { background: #3d5a80; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }


    .btn-mic-allow {
      background: var(--mic);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      min-height: 36px;
      flex-shrink: 0;
    }
    .btn-mic-allow:disabled {
      opacity: 0.45;
    }
    .btn-mic-allow.hidden { display: none; }

    .file-warn {
      display: none;
      position: fixed;
      top: calc(6px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 600;
      background: #fff3cd;
      color: #6b5300;
      border: 1px solid #e6d08a;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.72rem;
      line-height: 1.35;
      max-width: min(520px, calc(100vw - 24px));
      box-shadow: 0 4px 14px rgba(61, 44, 30, 0.12);
      text-align: center;
    }
    .file-warn.show { display: block; }

    footer { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-left">
        <h1>⭐ Plus &amp; Sterne</h1>
        <p class="header-date" id="headerDate"></p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn-primary" id="btnAdd">＋ Schüler</button>
        <button type="button" class="btn-secondary" id="btnExport">CSV</button>
        <button type="button" class="btn-secondary" id="btnSeed">Klasse</button>
        <button type="button" class="btn-danger" id="btnReset">Zurücksetzen</button>
      </div>
    </header>

    <div class="students" id="students"></div>
  </div>

  <div class="file-warn" id="fileWarn" role="status"></div>

  <div class="voice-bar" aria-label="Sprachsteuerung">
    <button type="button" class="mic-btn" id="micBtn" title="Gedrückt halten oder tippen" aria-label="Mikrofon">🎤</button>
    <button type="button" class="btn-mic-allow" id="micAllowBtn">Mikrofon erlauben</button>
    <div class="voice-meta">
      <strong id="liveTranscript">—</strong>
      <div class="last-cmd" id="lastCommand">Befehl: —</div>
    </div>
  </div>
  <div class="voice-warn" id="voiceWarn"></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="modalTitle">Schüler hinzufügen</h3>
      <p id="modalDesc">Namen eingeben</p>
      <input type="text" id="modalInput" autocomplete="off" maxlength="40" placeholder="Vorname" />
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modalCancel">Abbrechen</button>
        <button type="button" class="btn-primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  const STORAGE_KEY = 'classroom-plus-v7';
  const MAX_PLUSES = 10;
  const MAX_MINUSES = 10;
  const PLUS_ROWS = 2;
  const MINUS_ROWS = 2;
  const SLOTS_PER_ROW = 5;
  const ROSTER = [
    'Aian',
    'Amara',
    'Amer',
    'Andre',
    'Bella',
    'Ceren',
    'Clara',
    'Emmi',
    'Khalil',
    'Leo',
    'Mina',
    'Mostafa',
    'Mussa',
    'Noura',
    'Patricia',
    'Rose',
    'Sanna',
    'Shantal',
    'Valeriia'
  ];

  function uid() {
    return 's_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function makeStudent(name) {
    return { id: uid(), name: name, pluses: 0, minuses: 0 };
  }

  function sortStudents() {
    students.sort(function (a, b) {
      return a.name.localeCompare(b.name, 'de', { sensitivity: 'base' });
    });
  }

  function effectivePluses(s) {
    return Math.max(0, (s.pluses || 0) - (s.minuses || 0));
  }

  function starsFromEffective(eff) {
    if (eff >= 10) return 2;
    if (eff >= 5) return 1;
    return 0;
  }

  let students = [];
  let modalMode = null;
  let modalTargetId = null;
  let modalResolve = null;

  const el = {
    students: document.getElementById('students'),
    micBtn: document.getElementById('micBtn'),
    micAllowBtn: document.getElementById('micAllowBtn'),
    liveTranscript: document.getElementById('liveTranscript'),
    lastCommand: document.getElementById('lastCommand'),
    voiceWarn: document.getElementById('voiceWarn'),
    fileWarn: document.getElementById('fileWarn'),
    toasts: document.getElementById('toasts'),
    modal: document.getElementById('modal'),
    modalTitle: document.getElementById('modalTitle'),
    modalDesc: document.getElementById('modalDesc'),
    modalInput: document.getElementById('modalInput'),
    modalOk: document.getElementById('modalOk'),
    modalCancel: document.getElementById('modalCancel'),
  };

  function save() {
    try {
      const payload = students.map(function (s) {
        const eff = effectivePluses(s);
        return {
          id: s.id,
          name: s.name,
          pluses: s.pluses,
          minuses: s.minuses,
          stars: starsFromEffective(eff),
        };
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
      toast('Speichern fehlgeschlagen', 'warn');
    }
  }

  function load() {
    try {
      let raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) raw = localStorage.getItem('classroom-plus-v6');
      if (!raw) raw = localStorage.getItem('classroom-plus-v5');
      if (raw) {
        const data = JSON.parse(raw);
        if (Array.isArray(data)) {
          students = data.map(function (s) {
            // Minuses are independent of pluses (no clamp to pluses).
            const pluses = Math.min(MAX_PLUSES, Math.max(0, parseInt(s.pluses, 10) || 0));
            const minuses = Math.min(MAX_MINUSES, Math.max(0, parseInt(s.minuses, 10) || 0));
            return {
              id: s.id || uid(),
              name: String(s.name || '').trim() || 'Ohne Namen',
              pluses: pluses,
              minuses: minuses,
            };
          });
          save();
          return;
        }
      }
    } catch (e) { /* ignore */ }
    students = ROSTER.map(makeStudent);
    save();
  }

  function toast(msg, type) {

  function addPlus(id) {

  function renderPluses(pluses, minuses) {
    const filled = Math.min(Math.max(0, pluses), MAX_PLUSES);
    // Cancelled visuals = min(pluses, minuses); extra minuses stay only in minus row.
    const cancelled = Math.min(Math.max(0, minuses), filled);
    let html = '<div class="plus-grid" aria-label="' + filled + ' Plus, ' + cancelled + ' storniert">';
    for (let row = 0; row < PLUS_ROWS; row++) {
      html += '<div class="plus-row">';
      for (let col = 0; col < SLOTS_PER_ROW; col++) {
        const i = row * SLOTS_PER_ROW + col;
        let state = 'empty';
        if (i < filled) {
          state = i < cancelled ? 'cancelled' : 'active';
        }
        html += renderPlusSlot(state);
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderMinuses(n) {

  el.students.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-act]');
    if (btn) {
      const card = btn.closest('[data-id]');
      if (!card) return;
      const id = card.getAttribute('data-id');
      const act = btn.getAttribute('data-act');
      if (act === 'plus') addPlus(id);
      else if (act === 'minus') addMinus(id);
      else if (act === 'rename') openRename(id);
      else if (act === 'remove') openRemove(id);
      return;
    }
    const slot = e.target.closest('[data-slot]');
    if (!slot) return;
    if (slot.getAttribute('data-filled') !== '0') return; // filled uses dblclick only
    e.preventDefault();
    const card = slot.closest('[data-id]');
    if (!card) return;
    const id = card.getAttribute('data-id');
    const kind = slot.getAttribute('data-slot');
    if (kind === 'plus') addPlus(id);

  /* —— Voice —— */
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MIC_FLAG = 'micGranted';
  const TAP_MS = 300;
  const isFileProto = location.protocol === 'file:';
  const secureOk = (typeof window.isSecureContext === 'undefined') ? !isFileProto : window.isSecureContext;

  let recognition = null;
  let listening = false;
  let wantListening = false;
  let micGranted = false;
  let micWarming = false;
  let toggleSession = false;
  let pointerDownAt = 0;
  let startedOnPointerDown = false;
  let pointerIdActive = null;
  let processedFinals = new Set();

  try {
    micGranted = localStorage.getItem(MIC_FLAG) === '1';
  } catch (e) { micGranted = false; }

  function normalizeText(s) {
    return String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/ß/g, 'ss')
      .replace(/[.,!?…:;«»"'\-–—]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function softPhonetic(s) {
    let t = normalizeText(s);
    t = t.replace(/ph/g, 'f');
    t = t.replace(/ae/g, 'a');
    t = t.replace(/ay|aj/g, 'ai');
    t = t.replace(/c/g, 'k');
    t = t.replace(/\bh(?=[aeiouyäöü])/g, '');
    t = t.replace(/(.)\1+/g, '$1');
    return t;
  }

  function sharedPrefixLen(a, b) {
    const n = Math.min(a.length, b.length);
    let i = 0;
    while (i < n && a[i] === b[i]) i++;
    return i;
  }

  function tokenOverlap(a, b) {
    const ta = a.split(' ').filter(Boolean);
    const tb = b.split(' ').filter(Boolean);
    if (!ta.length || !tb.length) return 0;
    let hits = 0;
    ta.forEach(function (x) {
      tb.forEach(function (y) {
        if (x === y || x.indexOf(y) === 0 || y.indexOf(x) === 0) hits++;
      });
    });
    return hits;
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = a.length, n = b.length;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = dp[j];
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + cost);
        prev = tmp;
      }
    }
    return dp[n];
  }

  function firstName(full) {
    return normalizeText(full).split(' ')[0];
  }

  /** Alias keys are normalizeText() form → canonical first-name (normalized). */
  const NAME_ALIASES = {
    // Aian (ASR: Haiyan / Hayan / Аян → Хайян)
    aian: 'aian', ayan: 'aian', ajan: 'aian', aiann: 'aian',
    haiyan: 'aian', hayan: 'aian', hayyan: 'aian', haijan: 'aian',
    ayyan: 'aian', aiian: 'aian', ian: 'aian',

    amara: 'amara', amira: 'amara',
    amer: 'amer', amir: 'amer', aamer: 'amer',

    // Bella

    emmi: 'emmi', emi: 'emmi', emmie: 'emmi', emmy: 'emmi',
    // Khalil
    khalil: 'khalil', kalil: 'khalil', chalil: 'khalil', halil: 'khalil', calil: 'khalil',
    // Leo / Mina
    leo: 'leo', lea: 'leo',
    mina: 'mina', meena: 'mina', myna: 'mina',
    // Mostafa
    mostafa: 'mostafa', mustafa: 'mostafa', mostaffa: 'mostafa',
    mustapha: 'mostafa', mostapha: 'mostafa',
    // Mussa
    mussa: 'mussa', musa: 'mussa', moussa: 'mussa', musaa: 'mussa',

    noura: 'noura', nura: 'noura', noora: 'noura', nora: 'noura',
    // Patricia / Rose / Sanna / Shantal / Valeriia
    patricia: 'patricia', patrizia: 'patricia', patricija: 'patricia',
    rose: 'rose', rosa: 'rose',
    sanna: 'sanna', sana: 'sanna', sahna: 'sanna',
    shantal: 'shantal', chantal: 'shantal', schantal: 'shantal',
    shantall: 'shantal', chantel: 'shantal',
    valeriia: 'valeriia', valeria: 'valeriia', valeriya: 'valeriia',
    valerija: 'valeriia', valery: 'valeriia', waleria: 'valeriia',
  };

  function resolveAlias(q) {
    const n = normalizeText(q);
    if (NAME_ALIASES[n]) return NAME_ALIASES[n];
    const soft = softPhonetic(n);
    if (NAME_ALIASES[soft]) return NAME_ALIASES[soft];
    // try alias keys after soft phonetic on both sides
    for (const key of Object.keys(NAME_ALIASES)) {
      if (softPhonetic(key) === soft) return NAME_ALIASES[key];
    }
    return n;
  }

  /**
   * Score spoken name against a roster student. Lower is better.
   * Returns { dist, prefix, exact, aliased }.
   */
  function scoreNameAgainstStudent(spokenName, student, aggressive) {
    const rawQ = normalizeText(spokenName);
    if (!rawQ) return null;
    const aliasedQ = resolveAlias(rawQ);
    const softQ = softPhonetic(aliasedQ);
    const fn = firstName(student.name);
    const full = normalizeText(student.name);
    const softFn = softPhonetic(fn);
    const softFull = softPhonetic(full);
    const canonFn = resolveAlias(fn);

    let dist = Math.min(
      levenshtein(aliasedQ, fn),
      levenshtein(aliasedQ, full),
      levenshtein(softQ, softFn),
      levenshtein(softQ, softFull),
      levenshtein(softQ, softPhonetic(canonFn))
    );

    let exact = (aliasedQ === fn || softQ === softFn || rawQ === fn);
    let aliased = (NAME_ALIASES[normalizeText(spokenName)] != null) ||
      (resolveAlias(rawQ) === canonFn && normalizeText(spokenName) !== fn);

    if (aliasedQ === fn || softQ === softFn || aliasedQ === canonFn) {
      dist = 0;
      exact = exact || (normalizeText(spokenName) === fn);
    }
    if (fn.indexOf(aliasedQ) === 0 || aliasedQ.indexOf(fn) === 0) dist = Math.min(dist, 0.5);
    if (softFn.indexOf(softQ) === 0 || softQ.indexOf(softFn) === 0) dist = Math.min(dist, 0.5);
    if (full.indexOf(aliasedQ) !== -1 || softFull.indexOf(softQ) !== -1) dist = Math.min(dist, 0.5);

    // Multi-token garbage: compare each token & best substring
    const tokens = rawQ.split(' ').filter(Boolean);
    tokens.forEach(function (tok) {
      const tAlias = resolveAlias(tok);
      const tSoft = softPhonetic(tAlias);
      dist = Math.min(dist, levenshtein(tAlias, fn), levenshtein(tSoft, softFn));
      if (tAlias === fn || tSoft === softFn || tAlias === canonFn) {
        dist = 0;
        aliased = true;
      }
    });

    const overlap = tokenOverlap(softQ, softFn);
    if (overlap > 0) dist = Math.min(dist, Math.max(0, softFn.length - overlap * 2));

    // Substring containment of soft forms
    if (softQ.length >= 3 && (softFn.indexOf(softQ) !== -1 || softQ.indexOf(softFn) !== -1)) {
      dist = Math.min(dist, Math.abs(softQ.length - softFn.length) * 0.5);
    }

    const prefix = Math.max(
      sharedPrefixLen(aliasedQ, fn),
      sharedPrefixLen(softQ, softFn)
    );

    const threshold = aggressive
      ? Math.max(2, Math.floor(fn.length / 2))
      : Math.max(1, Math.floor(fn.length / 3));

    if (dist > threshold) return null;
    return { dist: dist, prefix: prefix, exact: exact && dist === 0 && !aliased, aliased: aliased || (!exact && dist === 0), threshold: threshold };
  }

  function fuzzyFindStudent(spokenName, aggressive) {
    let best = null;
    let bestMeta = null;
    students.forEach(function (s) {
      const meta = scoreNameAgainstStudent(spokenName, s, !!aggressive);
      if (!meta) return;
      if (
        !bestMeta ||
        meta.dist < bestMeta.dist ||
        (meta.dist === bestMeta.dist && meta.prefix > bestMeta.prefix)
      ) {
        bestMeta = meta;
        best = s;
      }
    });
    if (!best) return null;
    return { student: best, meta: bestMeta, spoken: spokenName };
  }

  const ACTION_WORDS = {
    plus: ['plus', 'plus eins'],
    minus: ['minus'],
    stern: ['stern', 'sternchen'],
  };

  function stripActionWords(raw) {
    let namePart = raw;
    const tokens = raw.split(' ').filter(Boolean);
    let action = null;

    function matchActionAt(startIdx) {
      for (let len = 2; len >= 1; len--) {
        if (startIdx + len > tokens.length) continue;
        const phrase = tokens.slice(startIdx, startIdx + len).join(' ');
        for (const key of Object.keys(ACTION_WORDS)) {
          if (ACTION_WORDS[key].indexOf(phrase) !== -1) {
            return { key: key, start: startIdx, end: startIdx + len };
          }
        }
      }
      return null;
    }

    for (let i = tokens.length - 1; i >= 0; i--) {
      const m = matchActionAt(i);
      if (m && m.end === tokens.length) {
        action = m.key;
        namePart = tokens.slice(0, m.start).join(' ');
        break;
      }
    }
    if (!action) {
      const m = matchActionAt(0);
      if (m) {
        action = m.key;
        namePart = tokens.slice(m.end).join(' ');
      }
    }
    if (!action) {
      for (const key of Object.keys(ACTION_WORDS)) {
        for (const w of ACTION_WORDS[key]) {
          const re = new RegExp('(?:^|\\s)' + w.replace(/ /g, '\\s+') + '(?:\\s|$)');
          if (re.test(raw)) {
            action = key;
            namePart = raw.replace(re, ' ').replace(/\s+/g, ' ').trim();
            break;
          }
        }
        if (action) break;
      }
    }
    return { action: action, namePart: namePart };
  }

  function parseCommand(text) {
    const raw = normalizeText(text);
    if (!raw) return null;

    const stripped = stripActionWords(raw);
    if (!stripped.action || !stripped.namePart) return null;

    const aggressive = true; // action known → generous name match
    const hit = fuzzyFindStudent(stripped.namePart, aggressive);
    if (!hit) {
      return { error: 'name', namePart: stripped.namePart, action: stripped.action, raw: raw, transcript: text };
    }
    const spokenNorm = normalizeText(stripped.namePart);
    const rosterNorm = firstName(hit.student.name);
    const wasExact = spokenNorm === rosterNorm || softPhonetic(spokenNorm) === softPhonetic(rosterNorm);
    return {
      student: hit.student,
      action: stripped.action,
      raw: raw,
      transcript: text,
      namePart: stripped.namePart,
      fuzzy: !wasExact || (hit.meta && hit.meta.aliased && hit.meta.dist === 0 && spokenNorm !== rosterNorm),
      spokenName: stripped.namePart,
    };
  }

  /** Score one transcript; lower score is better. null if unusable. */
  function scoreParse(parsed) {
    if (!parsed) return { score: Infinity, parsed: null };
    if (parsed.error === 'name') return { score: 1000, parsed: parsed };
    const base = parsed.fuzzy ? 10 : 0;
    const actionPenalty = parsed.action === 'stern' ? 1 : 0;
    return { score: base + actionPenalty, parsed: parsed };
  }

  function pickBestFromAlternatives(result) {
    let best = null;
    let bestScore = Infinity;
    const n = Math.min(result.length || 0, 8);
    for (let a = 0; a < n; a++) {
      const alt = result[a];
      if (!alt || !alt.transcript) continue;
      const parsed = parseCommand(alt.transcript);
      const scored = scoreParse(parsed);
      // Prefer successful student matches heavily
      let s = scored.score;
      if (parsed && parsed.student) {
        // refine with fuzzy meta if available
        const hit = fuzzyFindStudent(parsed.namePart || '', true);
        if (hit && hit.meta) s = hit.meta.dist * 10 - hit.meta.prefix + (parsed.fuzzy ? 1 : 0);
        else s = 0;
      } else if (parsed && parsed.error === 'name') {
        s = 500 + (alt.confidence != null ? (1 - alt.confidence) : 0);
      } else {
        s = 2000;
      }
      // slight preference for higher ASR confidence when tied
      if (alt.confidence != null) s += (1 - alt.confidence) * 0.01;
      if (s < bestScore) {
        bestScore = s;
        best = parsed;
        if (best) best.altIndex = a;
        if (best) best.altTranscript = alt.transcript;
      }
    }
    return best;
  }

  function actionLabel(action) {
    if (action === 'minus') return 'Minus';
    if (action === 'stern') return 'Stern';
    return 'Plus';
  }

  function applyVoiceCommand(parsed) {
    if (!parsed) {
      toast('Befehl nicht erkannt. Beispiel: «Amer plus»', 'warn');
      el.lastCommand.textContent = 'Befehl: nicht erkannt';
      return;
    }
    if (parsed.error === 'name') {
      toast('Schüler nicht gefunden: «' + parsed.namePart + '»', 'warn');
      el.lastCommand.textContent = 'Befehl: nicht gefunden («' + parsed.namePart + '»)';
      return;
    }
    const label = actionLabel(parsed.action);
    el.lastCommand.textContent = 'Befehl: ' + parsed.student.name + ' → ' + label;

    // Toast correction when ASR name ≠ roster name
    if (parsed.fuzzy) {
      const heard = (parsed.altTranscript || parsed.transcript || parsed.spokenName || '').trim();
      const heardName = parsed.spokenName || heard;
      toast('«' + heardName + '» → ' + parsed.student.name + ' + ' + label, 'info');
    }

    if (parsed.action === 'minus') addMinus(parsed.student.id);
    else addPlus(parsed.student.id); // plus + stern → Plus
  }

  function buildSpeechGrammar() {
    try {
      const SpeechGrammarList = window.SpeechGrammarList || window.webkitSpeechGrammarList;
      if (!SpeechGrammarList) return null;
      const names = [];
      const seen = {};
      students.forEach(function (s) {
        const fn = String(s.name || '').split(/\s+/)[0];
        if (fn && !seen[fn.toLowerCase()]) {
          seen[fn.toLowerCase()] = true;
          names.push(fn);
        }
      });
      // Also bias common ASR mangling aliases (first tokens)
      ['Haiyan', 'Hayan', 'Ayan', 'Ajan', 'Kalil', 'Valeria', 'Chantal', 'Mustafa', 'Musa', 'Klara', 'Seren', 'Nura', 'Emi', 'Amir'].forEach(function (a) {
        if (!seen[a.toLowerCase()]) {
          seen[a.toLowerCase()] = true;
          names.push(a);
        }
      });
      const actions = ['plus', 'Minus', 'Stern', 'Sternchen'];
      const terms = names.concat(actions).map(function (t) {
        return t.replace(/[();|<>]/g, '');
      }).filter(Boolean);
      if (!terms.length) return null;
      const jsgf = '#JSGF V1.0; grammar classroom; public <cmd> = ' + terms.join(' | ') + ' ;';
      const list = new SpeechGrammarList();
      list.addFromString(jsgf, 1.0);
      return list;
    } catch (e) {
      return null;
    }
  }

  function applySpeechGrammar(rec) {
    try {
      const list = buildSpeechGrammar();
      if (list) rec.grammars = list;
    } catch (e) {
      /* Chrome support is flaky — ignore */
    }
  }

  function setListeningUI(on) {
    listening = on;
    el.micBtn.classList.toggle('listening', on);
    el.micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function showMicHelp(msg) {
    el.voiceWarn.classList.add('show');
    el.voiceWarn.textContent = msg;
  }

  function hideMicHelp() {
    el.voiceWarn.classList.remove('show');
    el.voiceWarn.textContent = '';
  }

  function updateMicAllowUI() {
    if (!el.micAllowBtn) return;
    if (micGranted) {
      el.micAllowBtn.classList.add('hidden');
      el.micAllowBtn.disabled = true;
    } else {
      el.micAllowBtn.classList.remove('hidden');
      el.micAllowBtn.disabled = false;
      el.micAllowBtn.textContent = 'Mikrofon erlauben';
    }
  }

  function markMicGranted() {
    micGranted = true;
    try { localStorage.setItem(MIC_FLAG, '1'); } catch (e) { /* best-effort */ }
    updateMicAllowUI();
    hideMicHelp();
  }

  function markMicDenied() {
    micGranted = false;
    try { localStorage.removeItem(MIC_FLAG); } catch (e) { /* */ }
    updateMicAllowUI();
    el.micAllowBtn.classList.remove('hidden');
    el.micAllowBtn.disabled = false;
    el.micAllowBtn.textContent = 'Mikrofon erlauben';
  }

  async function warmUpMic() {
    if (micWarming) return false;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMicHelp('Dieser Browser unterstützt kein Mikrofon (getUserMedia).');
      toast('Mikrofon nicht verfügbar', 'warn');
      return false;
    }
    micWarming = true;
    el.micAllowBtn.disabled = true;
    el.micAllowBtn.textContent = 'Erlaube…';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* */ } });
      markMicGranted();
      toast('Mikrofon erlaubt', 'success');
      el.liveTranscript.textContent = 'Mikrofon bereit — halten oder tippen';
      return true;
    } catch (err) {
      markMicDenied();
      showMicHelp('Mikrofon nicht erlaubt — bitte auf «Mikrofon erlauben» tippen und im Dialog zulassen.');
      toast('Mikrofon blockiert — bitte erlauben', 'warn');
      return false;
    } finally {
      micWarming = false;
      if (!micGranted) {
        el.micAllowBtn.disabled = false;
        el.micAllowBtn.textContent = 'Mikrofon erlauben';
      }
    }
  }

  function ensureRecognition() {
    if (recognition) return true;
    if (!SpeechRecognition) return false;
    recognition = new SpeechRecognition();
    recognition.lang = 'de-DE';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 5;
    applySpeechGrammar(recognition);

    recognition.onresult = function (event) {
      let interim = '';
      let displayFinal = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        const top = res[0] ? res[0].transcript : '';
        if (res.isFinal) {
          displayFinal += top;
          const best = pickBestFromAlternatives(res);
          const keyBase = best && best.student
            ? (best.student.id + ':' + best.action)
            : normalizeText(top);
          const key = i + ':' + keyBase;
          if (!processedFinals.has(key) && (normalizeText(top) || (best && best.student))) {
            processedFinals.add(key);
            if (processedFinals.size > 80) {
              processedFinals = new Set(Array.from(processedFinals).slice(-40));
            }
            applyVoiceCommand(best);
          }
        } else {
          interim += top;
        }
      }
      el.liveTranscript.textContent = displayFinal || interim || 'Ich höre zu…';
    };

    recognition.onerror = function (event) {
      if (event.error === 'not-allowed') {
        wantListening = false;
        toggleSession = false;
        setListeningUI(false);
        markMicDenied();
        showMicHelp('Kein Mikrofonzugriff — bitte «Mikrofon erlauben» tippen und zulassen.');
        toast('Mikrofon blockiert — bitte erlauben', 'warn');
      } else if (event.error === 'no-speech') {
        el.liveTranscript.textContent = wantListening ? 'Keine Sprache — weiter sprechen…' : 'Keine Sprache erkannt';
      } else if (event.error === 'aborted') {
        /* ignore */
      } else {
        toast('Sprachfehler: ' + event.error, 'warn');
      }
    };

    recognition.onend = function () {
      if (wantListening) {
        // Keep continuous session alive without re-prompting permission
        try {
          recognition.start();
          setListeningUI(true);
        } catch (e) {
          setTimeout(function () {
            if (!wantListening) return;
            try {
              recognition.start();
              setListeningUI(true);
            } catch (e2) {
              wantListening = false;
              toggleSession = false;
              setListeningUI(false);
            }
          }, 120);
        }
      } else {
        setListeningUI(false);
        if (!el.liveTranscript.textContent || el.liveTranscript.textContent === 'Ich höre zu…') {
          el.liveTranscript.textContent = micGranted
            ? 'Gedrückt halten oder tippen'
            : 'Zuerst «Mikrofon erlauben»';
        }
      }
    };

    return true;
  }

  async function startListening() {
    if (!SpeechRecognition) {
      toast('Spracherkennung nicht verfügbar — Chrome/Edge nutzen', 'warn');
      return;
    }
    if (!micGranted) {
      const ok = await warmUpMic();
      if (!ok) return;
    }
    if (!ensureRecognition()) {
      toast('Spracherkennung nicht verfügbar', 'warn');
      return;
    }
    wantListening = true;
    processedFinals = new Set();
    try {
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 5;
      applySpeechGrammar(recognition);
      el.liveTranscript.textContent = 'Ich höre zu…';
      recognition.start();
      setListeningUI(true);
    } catch (e) {
      // already started
      setListeningUI(true);
    }
  }

  function stopListening() {
    wantListening = false;
    toggleSession = false;
    if (!recognition) {
      setListeningUI(false);
      return;
    }
    try { recognition.stop(); } catch (e) { /* */ }
    setListeningUI(false);
  }

  // Persistent file:// / insecure-context notice (mic button stays usable)
  if (isFileProto || !secureOk) {
    el.fileWarn.classList.add('show');
    el.fileWarn.textContent =
      'Hinweis: Unter file:// bleibt die Mikrofon-Erlaubnis oft nicht gespeichert — der Browser kann erneut fragen. ' +
      'Besser lokal öffnen: im Ordner «python3 -m http.server 8080» und dann http://localhost:8080/ nutzen.';
  }

  updateMicAllowUI();
  el.micAllowBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    warmUpMic();
  });

  if (!SpeechRecognition) {
    showMicHelp(
      'Mikrofon/Stimme: bitte Chrome oder Edge nutzen. Kartentasten ＋/− funktionieren immer.'
    );
    el.micBtn.title = 'Stimme braucht Chrome/Edge';
    el.liveTranscript.textContent = 'Stimme hier nicht verfügbar';
    el.micBtn.addEventListener('click', function (e) {
      e.preventDefault();
      toast('Stimme braucht Chrome/Edge + Mikrofon-Erlaubnis', 'warn');
    });
  } else {
    el.micBtn.title = 'Gedrückt halten: mehrere Befehle · Tippen: An/Aus';
    el.liveTranscript.textContent = micGranted
      ? 'Gedrückt halten oder tippen — z. B. «Amer plus»'
      : 'Zuerst «Mikrofon erlauben», dann halten oder tippen';

    // Press-and-hold primary; short tap = toggle session
    el.micBtn.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      try { el.micBtn.setPointerCapture(e.pointerId); } catch (err) { /* */ }
      pointerIdActive = e.pointerId;
      pointerDownAt = Date.now();
      if (toggleSession && listening) {
        startedOnPointerDown = false;
        return;
      }
      if (!listening) {
        startedOnPointerDown = true;
        startListening();
      } else {
        startedOnPointerDown = false;
      }
    });

    function endPointer(e) {
      if (pointerIdActive != null && e.pointerId !== pointerIdActive) return;
      const dur = Date.now() - pointerDownAt;
      pointerIdActive = null;
      try { el.micBtn.releasePointerCapture(e.pointerId); } catch (err) { /* */ }

      if (toggleSession) {
        // Tap while in toggle session → turn off
        if (!startedOnPointerDown) {
          stopListening();
        }
        return;
      }

      if (startedOnPointerDown) {
        if (dur < TAP_MS) {
          // Short tap → stay listening until next tap
          toggleSession = true;
          wantListening = true;
          el.liveTranscript.textContent = 'Sitzung an — tippen zum Beenden';
        } else {
          // Hold release → stop
          stopListening();
        }
      } else if (listening) {
        stopListening();
      }
      startedOnPointerDown = false;
    }

    el.micBtn.addEventListener('pointerup', endPointer);
    el.micBtn.addEventListener('pointercancel', function (e) {
      if (pointerIdActive != null && e.pointerId !== pointerIdActive) return;
      pointerIdActive = null;
      startedOnPointerDown = false;
      if (!toggleSession) stopListening();
    });

    // Avoid duplicate click handling on the mic
    el.micBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }

  const headerDate = document.getElementById('headerDate');
  let lastDateKey = '';

  function formatDateDe(d) {
    return d.toLocaleDateString('de-DE', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
    });
  }

  function updateHeaderDate() {
    const now = new Date();
    const key = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
    if (key === lastDateKey) return;
    lastDateKey = key;
    headerDate.textContent = formatDateDe(now);
  }

  updateHeaderDate();
  setInterval(updateHeaderDate, 60 * 1000);

  load();
  render();
})();
  </script>
</body>
</html>
